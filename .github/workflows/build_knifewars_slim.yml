name: Build knifewars_slim

# Knife Wars 1 build 1: official web release minus every engine feature the game does not use
# (see profiles/knifewars_slim.py). 2D only: 3D, physics, navigation, XR out. Class build profile:
# profiles/knifewars_slim.gdbuild.
# Runs by hand (Actions tab -> "Build knifewars_slim" -> Run workflow) and also by itself
# when this file or either profile file is pushed to main (4.6-stable, Emscripten 4.0.20).
on:
  workflow_dispatch:
    inputs:
      godot_ref:
        description: "godotengine/godot tag (must match the editor that exports)"
        default: "4.6-stable"
      emscripten_version:
        description: "Emscripten version (official 4.6 web builds use 4.0.20)"
        default: "4.0.20"
  push:
    branches: [main]
    paths:
      - profiles/knifewars_slim.py
      - profiles/knifewars_slim.gdbuild
      - .github/workflows/build_knifewars_slim.yml

env:
  OPTIONS_FILE: profiles/knifewars_slim.py
  BUILD_PROFILE: profiles/knifewars_slim.gdbuild
  GODOT_REF: ${{ inputs.godot_ref || '4.6-stable' }}
  EMSCRIPTEN_VERSION: ${{ inputs.emscripten_version || '4.0.20' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout this repo (options file, build profile)
        uses: actions/checkout@v4

      - name: Checkout official Godot source
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: ${{ env.GODOT_REF }}
          path: godot

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SCons
        run: python -m pip install scons

      - name: Install Emscripten (official emsdk)
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git emsdk
          ./emsdk/emsdk install ${{ env.EMSCRIPTEN_VERSION }}
          ./emsdk/emsdk activate ${{ env.EMSCRIPTEN_VERSION }}

      - name: Build template_release (web, no threads, 2D only, unused features out)
        run: |
          source emsdk/emsdk_env.sh
          OPTIONS="$GITHUB_WORKSPACE/${{ env.OPTIONS_FILE }}"
          CLASSES="$GITHUB_WORKSPACE/${{ env.BUILD_PROFILE }}"
          for F in "$OPTIONS" "$CLASSES"; do
            if [ ! -f "$F" ]; then
              echo "::error::File not found: $F"
              exit 1
            fi
          done
          echo "Options file: ${{ env.OPTIONS_FILE }}"
          echo "Build profile: ${{ env.BUILD_PROFILE }}"
          cd godot
          scons platform=web target=template_release threads=no profile="$OPTIONS" build_profile="$CLASSES" -j"$(nproc)"

      - name: Package and report sizes
        run: |
          echo "Files in godot/bin:"
          ls -la godot/bin
          ZIP=$(ls godot/bin/godot.web.template_release*.nothreads*.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "::error::No godot.web.template_release*.nothreads*.zip in godot/bin (see list above)"
            exit 1
          fi
          echo "Template: $ZIP"
          echo "OPTIONS_NAME=$(basename "${{ env.OPTIONS_FILE }}" .py)" >> "$GITHUB_ENV"
          mkdir -p out
          cp "$ZIP" out/web_nothreads_release.zip
          mkdir -p check && cd check
          unzip -q ../out/web_nothreads_release.zip
          WASM=$(ls *.wasm | head -n 1)
          RAW=$(stat -c %s "$WASM")
          GZ=$(gzip -9 -c "$WASM" | wc -c)
          command -v brotli >/dev/null || sudo apt-get install -y -qq brotli >/dev/null || true
          BR=$(command -v brotli >/dev/null && brotli -q 11 -c "$WASM" | wc -c || echo "n/a")
          {
            echo "## Slim web template (${{ env.GODOT_REF }}, ${{ env.OPTIONS_FILE }})"
            echo "Built from \`$ZIP\`"
            echo ""
            echo "| file | bytes |"
            echo "|---|---|"
            echo "| $WASM (raw) | $RAW |"
            echo "| $WASM (gzip -9) | $GZ |"
            echo "| $WASM (brotli -q 11) | $BR |"
            echo "| web_nothreads_release.zip | $(stat -c %s ../out/web_nothreads_release.zip) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: web-slim-${{ env.GODOT_REF }}-${{ env.OPTIONS_NAME }}
          path: out/web_nothreads_release.zip
          if-no-files-found: error
